function decisionFor(w) {
 const f=w.user_fields||w, status=f.status||w.mcp_status;
 if(w.entity_type!=='pipeline_case'||w.archived||w.deleted||w.business_accepted||!['pending','in_progress','blocked'].includes(status))return null;
 const lines=String(f.note||'').split(/\r?\n/);
 if(lines[0]!=='【判断待ち】池田')return null;
 const labels=[['判断内容','question'],['推奨','recommendation'],['未決の影響','impact'],['判断元','source']];
 const out={judge:'池田',question:'',recommendation:'',impact:'',source:''};
 for(const [i,[label,key]] of labels.entries()){
  const prefix='【'+label+'】'; if(!lines[i+1]?.startsWith(prefix))return null;
  out[key]=lines[i+1].slice(prefix.length).trim();
 }
 out.sourceText=out.source;

function decisionListHTML(){const list=decisions();const item=w=>`<a class="queue-item" href="#decision/${E(w.id)}" data-remember="queue-${E(w.id)}"><span class="queue-copy"><span class="queue-question">${E(w.decision.question||'判断内容が未登録です')}</span><small>${E(w.title)}</small></span><span class="collapse-chevron" aria-hidden="true">${chevron}</span></a>`;return `<div class="queue-list compact-queue">${list.slice(0,3).map(item).join('')}${list.length>3?`<details class="queue-more"><summary data-remember="queue-more">ほか${list.length-3}件<span class="more-hint">開く / 閉じる</span></summary><div class="queue-rest">${list.slice(3).map(item).join('')}</div></details>`:''}</div>`;}
function focusHTML(){return decisions().length?`<section class="decision-overview" aria-label="あなたの判断待ち"><div class="decision-overview-head"><h2>あなたの判断待ち <span>${decisions().length}件</span></h2><span>押して内容を確認</span></div>${decisionListHTML()}</section>`:`<div class="compact-empty"><strong>あなたの判断待ちはありません。</strong><p>動いている仕事と、次に進むことを下で確認できます。</p></div>`;}
function workline(n){const w=n.work;return `<details class="workline" data-state="${E(w.state)}" data-work-id="${E(w.id)}"><summary class="work-summary" data-remember="summary-${E(w.id)}"><span class="summary-title" title="${E(w.title)}">${E(w.title)}${n.children.length?`<small class="branch-count">${n.count-1}件 / 停止 ${n.stopped-( ['blocked','decision'].includes(w.state)?1:0)}件</small>`:''}</span><span class="summary-now" title="${E(w.now)}"><span class="sr-only">いま：</span><small class="state-chip" data-tone="${E(w.state)}">${E(({decision:'判断',active:'進行',external:'返答',blocked:'停止',done:'完了'})[w.state]||'確認')}</small> ${E(w.now)}</span><span class="summary-due">${w.due?`<span>期日</span> ${E(w.due)}`:''}</span><span class="collapse-chevron" aria-hidden="true">${chevron}</span></summary><div class="work-expanded">${n.children.length?'':`<p class="expanded-title">${E(w.title)}</p><p class="expanded-meta">${E(w.project||'所属未設定')}${n.parentIssue?` / ${E(n.parentIssue)}`:''} / 実行担当 ${E(w.owner)} / ${E(labels[w.state]||'状態確認中')}</p><ol class="expanded-journey"><li><h3>できたこと</h3><p>${E(w.done||'完了した事実は未登録')}</p></li><li><h3>いま</h3><p>${E(w.now)}</p></li><li><h3>次</h3><p>${E(w.nextStep)}</p>${w.state==='decision'?'<small>判断後に着手・未実行</small>':''}</li></ol><div class="expanded-links"><a class="text-button" href="#work/${E(w.id)}" data-remember="open-${E(w.id)}">元の仕事を見る ${arrow}</a>${w.state==='decision'?`<a class="text-button" href="#decision/${E(w.id)}" data-remember="decision-${E(w.id)}">判断内容を見る ${arrow}</a>`:''}</div>`}${n.children.length?`<div class="work-children" aria-label="子の仕事">${n.children.map(workline).join('')}</div>`:''}</div></details>`;}
function flowHTML(){let works=rows.filter(w=>filter==='all'||w.state===filter);return pageHeading('仕事の流れ','事業 → 親ゴール → 子の仕事。必要なところだけ開けます。',true)+`<div id="focus-region">${focusHTML()}</div><section aria-labelledby="all-work-heading"><div class="section-head"><div class="section-head-left"><h2 id="all-work-heading">仕事の現在地</h2><span class="section-note">必要な仕事だけ開く</span></div><div class="filters" aria-label="仕事の状態で絞り込む">${[['all','すべて'],['active','動いている'],['external','返答待ち'],['blocked','停止'],['decision','判断待ち'],['done','完了']].map(([k,l])=>`<button data-filter="${k}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div></div><div class="worklines">${works.length?hierarchy(works).map(g=>`<details class="business-group"><summary class="business-summary"><strong>${E(g.title)}</strong><span>${g.count}件 / 停止 ${g.stopped}件</span>${chevron}</summary><div class="business-works">${g.nodes.map(workline).join('')}</div></details>`).join(''):'<div class="compact-empty"><strong>この状態の仕事はありません。</strong></div>'}</div><div class="flow-bottom"><span>${works.length}件表示 / 期日は仕事に登録された値だけを表示。</span><button class="text-button" data-action="refresh">状態を読み直す ${arrow}</button></div></section>`;}
function queueHTML(){return pageHeading('あなたの判断','明示登録された質問だけを表示。並び順は登録データのまま。')+(decisions().length?decisionListHTML():'<div class="empty-panel"><h2>あなたの判断待ちはありません。</h2><p>判断の明示登録がない仕事を、判断待ちとして補完することはありません。</p><a class="text-button" href="#flow">仕事の流れを見る '+arrow+'</a></div>');}
function decisionHTML(w){const d=w.decision,list=decisions(),idx=list.indexOf(w),next=list[idx+1];return `<div class="decision-page"><div class="view-top"><a class="back" href="#flow">${backIcon}仕事の流れ</a><div class="detail-position"><span>判断 ${idx+1} / ${list.length}</span>${next?`<a href="#decision/${E(next.id)}">次の判断 ${arrow}</a>`:`<a href="#decisions">判断の一覧</a>`}</div></div><header class="detail-heading"><p class="detail-kicker">あなたの判断待ち / まだ決定していません</p><h1 tabindex="-1">${Q(w)}</h1><div class="detail-work-meta"><a href="#work/${E(w.id)}">${E(w.title)}</a><span>実行担当 ${E(w.owner)}</span>${w.due?`<span>仕事の期日 ${E(w.due)}</span>`:''}<span>判断期限 未登録</span></div></header><div class="decision-body"><section class="recommendation"><p class="block-label">登録された提案</p><h2>${E(d.recommendation||'提案は未登録です。')}</h2><p class="not-decided">提案であり、決定事項ではありません。</p></section><section class="consequence"><h2>いま、止まっていること</h2><p class="impact-text">${E(d.impact||'未決の影響は未登録です。')}</p><div class="after-decision"><p class="block-label">決めた先に進む仕事</p><p>${E(w.afterDecision||w.nextStep)}</p><small>実行担当 ${E(w.owner)} / 判断後に着手・未実行</small></div></section></div><section class="answer-area" aria-labelledby="answer-title"><div class="answer-title"><h2 id="answer-title">自分の考えを下書きする</h2><button class="text-button" data-action="use-proposal" data-id="${E(w.id)}">登録された提案を下書きに使う</button></div><label for="answer" class="sr-only">回答の下書き（保存・送信されません）</label><textarea id="answer" data-id="${E(w.id)}" placeholder="賛成・変更したい点・確かめたいことを、自分の言葉で。">${E(drafts.get(w.id)||'')}</textarea><div class="answer-actions"><p>下書きはこの画面内だけ。本番への保存・送信・承認はしません。<br>再読み込みすると消えます。</p><button class="secondary" data-action="copy-draft" data-id="${E(w.id)}">下書きをコピー</button></div></section><section class="decision-sources"><a class="text-button" href="#work/${E(w.id)}">元の仕事・メモを見る ${arrow}</a><p>判断元 ${E(d.sourceText||'未登録')}<br>判断者：池田（サンプルの登録条件）</p></section><details class="decision-help"><summary>回答を記録するときの扱い</summary><p>現行の判断待ちは、元の仕事の現在のメモにある明示登録が根拠です。単に仕事を完了扱いにしたり、下書きを書いただけでは判断は確定しません。この試作は登録条件と閲覧の意味を保持し、実際の更新APIには接続していません。仕事の期日と判断期限は別の情報です。</p></details></div>`;}
function artifactsHTML(artifacts,work=null){return artifacts.length?`<div class="artifact-list">${artifacts.map(a=>{const href=safeArtifact(a.href);return href?`<a class="artifact-row" href="${E(href)}" target="_blank" rel="noopener noreferrer"><span class="file-glyph">HTML</span><span><span class="artifact-name">${E(a.name)}</span><span class="artifact-meta">${E(a.workTitle||work?.title||'')} / ${E(a.kind||'サンプル資料')}<br>${E(a.accepted||work?.state==='done'?'確認完了の架空例':'作業中の資料・未受入')}</span></span>${arrow}</a>`:`<div class="artifact-row"><span>${E(a.name)} / 開ける資料が未登録です。</span></div>`;}).join('')}</div>`:'<div class="compact-empty"><strong>成果資料はまだ登録されていません。</strong><p>作業中という状態だけで、成果があるとは扱いません。</p></div>';}
function workContent(w){if(workTab==='artifacts')return artifactsHTML(w.artifacts||[],w);if(workTab==='history')return `<ol class="history-list">${(w.history||[]).map(e=>`<li><h3>${E(e.label)}</h3><p>${E(e.body)}</p></li>`).join('')||'<li><p>記録は未登録です。</p></li>'}</ol>`;return `<dl class="definition-list"><div><dt>この仕事で実現すること</dt><dd>${E(w.purpose||'未登録')}</dd></div><div><dt>どこまでで完了か</dt><dd>${E(w.completion||'未登録')}</dd></div><div><dt>実行担当 / 仕事の期日</dt><dd>${E(w.owner)}${w.due?` / ${E(w.due)}`:''}</dd></div><div><dt>止まっている理由</dt><dd>${E(w.blocker||'停止理由の登録なし')}</dd></div>${w.decision?`<div><dt>現在のメモの明示登録</dt><dd>判断内容：${E(w.decision.question)}<br>提案：${E(w.decision.recommendation||'未登録')}<br>未決の影響：${E(w.decision.impact||'未登録')}</dd></div>`:''}<div><dt>情報の根拠</dt><dd>架空の設計確認用記録。記録された段階のみ表示し、進捗率・実績・期限を推測していません。</dd></div></dl>`;}
function workHTML(w){return `<div class="work-detail-page"><div class="view-top"><a class="back" href="#flow">${backIcon}仕事の流れ</a>${w.decision?`<a class="text-button" href="#decision/${E(w.id)}">あなたの判断を見る ${arrow}</a>`:''}</div><header class="work-detail-head"><div><p class="project-name">${E(w.project||'所属未設定')}</p><h1 tabindex="-1">${E(w.title)}</h1><div class="detail-work-meta"><span>実行担当 ${E(w.owner)}</span>${w.due?`<span>仕事の期日 ${E(w.due)}</span>`:''}</div></div><p class="work-detail-status"><i class="status-dot ${E(w.state)}"></i>${E(labels[w.state]||'状態確認中')}</p></header><div class="detail-journey" aria-label="仕事の段階">${(w.stages||[]).map(s=>`<div class="stage" data-state="${E(s.state)}">${E(s.name)}<small>${E({done:'完了した事実',active:'いま取り組んでいる',blocked:'ここで停止',pending:'これから・未実行'}[s.state]||'確認中')}</small></div>`).join('')}</div><section class="work-current"><div><h2>いま</h2><p>${E(w.now)}</p>${w.blocker?`<small>停止理由：${E(w.blocker)}</small>`:''}</div><div><h2>次に進むこと</h2><p>${E(w.nextStep)}</p>${w.decision?`<a class="primary" href="#decision/${E(w.id)}">判断内容を見る ${arrow}</a>`:''}</div></section><div class="tabs" role="tablist" aria-label="仕事の詳しい情報">${[['overview','仕事の詳細'],['artifacts',`成果・資料 ${(w.artifacts||[]).length}`],['history','記録']].map(([k,l])=>`<button role="tab" id="tab-${k}" aria-controls="detail-tab" aria-selected="${workTab===k}" tabindex="${workTab===k?'0':'-1'}" data-tab="${k}">${E(l)}</button>`).join('')}</div><div class="tab-content" id="detail-tab" role="tabpanel" aria-labelledby="tab-${E(workTab)}">${workContent(w)}</div></div>`;}
function resultsHTML(){const list=rows.flatMap(w=>(w.artifacts||[]).map(a=>({...a,workTitle:w.title,accepted:w.state==='done'})));return pageHeading('成果と、途中の資料','完成したものと、作業中のものを混同しない。')+artifactsHTML(list);}
function emptyHTML(){return pageHeading('仕事の流れ')+'<section class="empty-panel"><h2>表示できる仕事はありません。</h2><p>これは空のサンプルです。未取得の情報を仕事や進捗として補完しません。</p><button class="secondary" data-action="refresh">状態を読み直す</button></section>';}
function render({focus=false}={}){nav();if(phase==='loading'){main.innerHTML='<div class="loading-state" role="status"><span class="loading-line"></span>仕事の状態を読み込んでいます</div>';return;}if(phase!=='ready'){main.innerHTML=`<section class="error-state"><h1 tabindex="-1">${phase==='auth'?'認証を確認できないため、表示を消しました。':'仕事の状態を読み込めませんでした。'}</h1><p>${phase==='auth'?'表示済みの仕事と下書きを消去しました。これは認証切れの架空テストで、実際の認証には接続していません。':'現在の状態を確認できません。仕事がないという意味ではありません。状態を読み直してください。'}</p><button class="secondary" data-action="refresh">もう一度読み込む</button></section>`;return;}const {view,id}=route(),w=rows.find(x=>x.id===id);if(!rows.length)main.innerHTML=emptyHTML();else if(view==='decision'&&w?.decision)main.innerHTML=decisionHTML(w);else if(view==='work'&&w)main.innerHTML=workHTML(w);else if(view==='decisions')main.innerHTML=queueHTML();else if(view==='results')main.innerHTML=resultsHTML();else if(view==='flow'||!view)main.innerHTML=flowHTML();else main.innerHTML='<div class="empty-panel"><h1 tabindex="-1">この仕事は表示できません。</h1><p>仕事がないか、現在のサンプルに含まれていません。</p><a class="text-button" href="#flow">仕事の流れに戻る '+arrow+'</a></div>';document.title=`${main.querySelector('h1')?.textContent||'仕事の流れ'} — Mjupaddness`;if(focus){window.scrollTo(0,0);const key=focusRestore.get(location.hash||'#flow'),el=key&&[...main.querySelectorAll('[data-remember]')].find(x=>x.dataset.remember===key);if(el){let ancestor=el.parentElement;while(ancestor){if(ancestor.matches('details'))ancestor.open=true;ancestor=ancestor.parentElement;}el.focus({preventScroll:true});el.scrollIntoView({block:'center',behavior:'instant'});}else main.querySelector('h1')?.focus({preventScroll:true});}}
async function load(){const g=++generation;rows=[];phase='loading';$('#search-results').replaceChildren();if($('#search-dialog').open)$('#search-dialog').close();render();try{const scenario=new URLSearchParams(location.search).get('scenario')||'normal';const data=FIXTURE;if(g!==generation)return;rows=project(Array.isArray(data.works)?data.works:[]);phase='ready';render();}catch(e){if(g!==generation)return;rows=[];phase='error';render();}}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4200);}
function search(){const q=$('#search-input').value;const found=phase==='ready'?searchWorks(rows,q):[];$('#search-results').innerHTML=found.length?found.map(w=>`<a class="search-result" href="#work/${E(w.id)}">${E(w.title)}<small>${E(w.owner)} / ${E(labels[w.state]||'状態確認中')}</small></a>`).join(''):`<p class="search-zero">${phase==='ready'?'一致する仕事はありません。仕事名・判断内容・担当を変えて探してください。':'現在の仕事を取得できていません。検索できる情報はありません。'}</p>`;}
function openSearch(){searchOpener=document.activeElement;$('#search-input').value='';search();$('#search-dialog').showModal();$('#search-input').focus();}
$('#open-search').addEventListener('click',openSearch);$('#close-search').addEventListener('click',()=>$('#search-dialog').close());$('#search-dialog').addEventListener('close',()=>searchOpener?.focus());$('#search-input').addEventListener('input',search);
$('#search-results').addEventListener('click',e=>{if(e.target.closest('a')){$('#search-dialog').close();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#search-dialog').open){e.preventDefault();$('#search-dialog').close();return;}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&!$('#search-dialog').open){e.preventDefault();openSearch();}});
document.addEventListener('click',async e=>{const remember=e.target.closest('[data-remember]');if(remember)focusRestore.set(location.hash||'#flow',remember.dataset.remember);const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();document.querySelector(`[data-filter="${filter}"]`)?.focus({preventScroll:true});return;}const t=e.target.closest('[data-tab]');if(t){workTab=t.dataset.tab;render();$(`#tab-${workTab}`)?.focus({preventScroll:true});return;}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='refresh'){await load();return;}if(action==='use-proposal'){const w=rows.find(x=>x.id===b.dataset.id);if(!w?.decision)return;const input=$('#answer');if(input.value.trim()){toast('入力済みの下書きは上書きしません。');input.focus();return;}input.value=w.decision.recommendation||'';drafts.set(w.id,input.value);input.focus();return;}if(action==='copy-draft'){const text=$('#answer')?.value||'';if(!text.trim()){toast('コピーする下書きを入力してください。');$('#answer')?.focus();return;}try{await navigator.clipboard.writeText(text);toast('下書きをコピーしました。保存・送信はしていません。');}catch(err){$('#answer').select();toast('自動コピーできません。選択した文章をコピーしてください。');}}});
document.addEventListener('input',e=>{if(e.target.id==='answer')drafts.set(e.target.dataset.id,e.target.value);});
document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['overview','artifacts','history'],i=tabs.indexOf(workTab);workTab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[2]:tabs[(i+(e.key==='ArrowRight'?1:2))%3];render();$(`#tab-${workTab}`).focus({preventScroll:true});}});
window.addEventListener('hashchange',()=>{workTab='overview';render({focus:true});});
load();

</script>
</body></html>
